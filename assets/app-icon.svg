<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25815F" />
      <stop offset="50%" stop-color="#1F6E50" />
      <stop offset="100%" stop-color="#13402E" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="bagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background base for standalone & maskable app icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle radial glow behind bag -->
  <circle cx="256" cy="210" r="140" fill="#2EA378" opacity="0.25" />

  <!-- Centered Bag Mascot -->
  <g transform="translate(256, 195) scale(3.4)" filter="url(#bagGlow)">
    <g transform="translate(-20, -22)">
      <!-- Motion Curves -->
      <path d="M-12 12 C-4 5, 4 4, 12 7" stroke="#A3D7C1" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M-15 18 C-8 11, 1 9, 8 13" stroke="#A3D7C1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
      
      <!-- Stylized Bag Body -->
      <path d="M16 10 C13 6, 21 3, 23 7 C25 5, 31 8, 28 12 C35 14, 38 27, 33 33 C28 38, 12 38, 7 33 C2 27, 5 14, 12 12 C9 8, 15 5, 16 10 Z" 
            fill="url(#bagGrad)" stroke="#383838" stroke-width="0.8"/>
      
      <!-- Bag Tie Knot -->
      <ellipse cx="20" cy="8" rx="4.5" ry="3" fill="#2EA378"/>
      
      <!-- Friendly Eyes -->
      <circle cx="15.5" cy="18" r="1.6" fill="#FFFFFF"/>
      <circle cx="24.5" cy="18" r="1.6" fill="#FFFFFF"/>
      <circle cx="16" cy="18" r="0.7" fill="#181818"/>
      <circle cx="25" cy="18" r="0.7" fill="#181818"/>
      
      <!-- Friendly Smile -->
      <path d="M13 23 C15 28, 25 28, 27 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Perfectly Centered App Title -->
  <!-- "Te" en Blanco, "La" en Verde Claro, "Tiro" en Blanco -->
  <text x="256" y="380" text-anchor="middle" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1.5" filter="url(#iconShadow)">
    Te<tspan fill="#A3D7C1">La</tspan>Tiro
  </text>

  <!-- Centered Subtitle Tagline Badge -->
  <rect x="76" y="405" width="360" height="30" rx="15" fill="#0C281D" opacity="0.45" />
  <text x="256" y="425" text-anchor="middle" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="14.5" fill="#D1EBE0" letter-spacing="0.8">
    Tú la dejas, nosotros la tiramos
  </text>
</svg>
