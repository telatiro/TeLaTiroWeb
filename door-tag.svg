<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tagGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25815F"/>
      <stop offset="100%" stop-color="#1B6348"/>
    </linearGradient>
    <filter id="tagShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Door Hanger Body with Top Hook Cutout -->
  <path d="M 30 10 
           L 130 10 
           A 20 20 0 0 1 150 30 
           L 150 290 
           A 20 20 0 0 1 130 310 
           L 30 310 
           A 20 20 0 0 1 10 290 
           L 10 30 
           A 20 20 0 0 1 30 10 Z" 
        fill="url(#tagGreen)" filter="url(#tagShadow)"/>

  <!-- Knob Hole Cutout -->
  <circle cx="80" cy="70" r="32" fill="#F4F6F5"/>
  <!-- Hook slit on the side -->
  <path d="M 80 70 L 150 70 L 150 78 L 80 78 Z" fill="#F4F6F5"/>

  <!-- Brand text on tag -->
  <g transform="translate(80, 150)" text-anchor="middle">
    <!-- Bag Icon Small -->
    <path d="M-6 -22 C-4 -26, 4 -26, 6 -22 C10 -20, 14 -12, 10 -6 C6 -1, -6 -1, -10 -6 C-14 -12, -10 -20, -6 -22 Z" fill="#FFFFFF"/>
    <circle cx="-2.5" cy="-14" r="0.9" fill="#1B6348"/>
    <circle cx="2.5" cy="-14" r="0.9" fill="#1B6348"/>
    <path d="M-3.5 -10.5 C-2 -8, 2 -8, 3.5 -10.5" stroke="#1B6348" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <text y="0" font-family="'Poppins', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="-0.5">TeLaTiro</text>
    <line x1="-40" y1="12" x2="40" y2="12" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
    
    <text y="32" font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#FFFFFF">TU DEPÓSITO</text>
    <text y="48" font-family="'Poppins', sans-serif" font-weight="400" font-size="10" fill="#E2E8F0">A DOMICILIO</text>
    
    <!-- Checklist item bullets -->
    <g transform="translate(-45, 75)" text-anchor="start">
      <circle cx="5" cy="-2" r="3" fill="#A7F3D0"/>
      <text x="14" y="2" font-family="'Poppins', sans-serif" font-weight="500" font-size="9" fill="#FFFFFF">Máx. 2 bolsas</text>
      
      <circle cx="5" cy="18" r="3" fill="#A7F3D0"/>
      <text x="14" y="22" font-family="'Poppins', sans-serif" font-weight="500" font-size="9" fill="#FFFFFF">Bien cerradas</text>
      
      <circle cx="5" cy="38" r="3" fill="#A7F3D0"/>
      <text x="14" y="42" font-family="'Poppins', sans-serif" font-weight="500" font-size="9" fill="#FFFFFF">En tu puerta</text>
    </g>
  </g>
</svg>
